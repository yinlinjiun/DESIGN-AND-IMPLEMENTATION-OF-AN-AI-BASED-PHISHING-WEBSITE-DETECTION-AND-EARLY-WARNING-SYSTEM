<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户信息提示中心</title>
    <style>
        body {
            margin: 0;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f3f6fb;
            color: #253044;
        }
        .wrap {
            max-width: 760px;
            margin: 56px auto;
            padding: 28px;
            background: #ffffff;
            border: 1px solid #d8e0ec;
            border-radius: 8px;
        }
        h1 {
            margin-top: 0;
            color: #1f3b66;
        }
        .notice {
            padding: 14px 16px;
            background: #fff7df;
            border-left: 4px solid #e5a100;
            margin: 18px 0;
        }
        a {
            color: #1f6fbf;
        }
    </style>
</head>
<body>
    <main class="wrap">
        <h1>账户信息提示中心</h1>
        <p>为了保障账号正常使用，请定期检查个人资料、联系方式和登录设备信息。</p>
        <div class="notice">
            当前页面仅用于系统中风险识别测试：页面没有密码框、银行卡字段、iframe、弹窗或自动跳转。
        </div>
        <p>如果需要修改资料，请前往官方平台的个人中心完成操作。</p>
        <p><a href="/help">查看帮助说明</a></p>
    </main>
</body>
</html>
